[package]
name = "jazari"
version = "1.0.2"
edition = "2024"
description = "An AI software company on your Claude subscription, and a live dashboard for every Claude Code session"
license = "MIT"
repository = "https://github.com/forhad-h/jazari"
homepage = "https://github.com/forhad-h/jazari"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "dashboard"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
regex = "1.13.1"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
sysinfo = "0.39.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
